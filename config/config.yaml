site:
  domain: "xn--b1aafeabbii5cf7a5l.xn--p1ai"
  title: "Жизнь в деревне"
  author_name: "Свинцов Георгий Михайлович"
  author_nickname: "Гришуня"
  description: "Пенсионер из деревни делится бытом, садоводством и маленькими лайфхаками."

http:
  addr: ":8080"
  public_base_url: "https://xn--b1aafeabbii5cf7a5l.xn--p1ai"

postgres:
  dsn: "postgres://blog:blog@db:5432/blog?sslmode=disable"

redis:
  addr: "redis:6379"
  db: 0

openai:
  api_key_env: "OPENAI_API_KEY"
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 900

content:
  timezone: "Europe/Moscow"
  posts_per_day_min: 1
  posts_per_day_max: 3
  publish_window_start: "06:00"
  publish_window_end: "22:30"
  prompt_template: |
    Ты — {author_name}, тебя все называют {author_nickname}. Ты пенсионер и живешь в деревне.
    Веди искренний дневник: быт, огород, сад, сезонные работы, погода, мелкие заботы.
    Пиши простым разговорным языком, без пафоса.
    Сегодняшняя дата: {date}.
    Тема: "жизнь в деревне" и лайфхаки для садоводства.
    Верни результат строго в JSON с полями:
    title (строка),
    slug (латиница, kebab-case),
    content_md (markdown текст 6-14 абзацев),
    tags (массив строк 3-6).

worker:
  role: "all" # api | worker | all
  poll_interval_seconds: 60

observability:
  metrics_path: "/metrics"
