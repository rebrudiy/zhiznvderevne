{{define "post"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Post.Title}} — {{.SiteTitle}}</title>
  <style>
    :root {
      --bg: #f7f2e9;
      --ink: #2b2b2b;
      --accent: #2d6a4f;
      --muted: #6b6b6b;
    }
    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      background: linear-gradient(180deg, #f7f2e9 0%, #efe7d7 100%);
      color: var(--ink);
    }
    header {
      padding: 32px 20px 12px;
      border-bottom: 2px solid #d6c9b7;
    }
    header a { color: var(--accent); text-decoration: none; }
    main { max-width: 820px; margin: 0 auto; padding: 20px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .content { font-size: 18px; line-height: 1.6; }
    .tags { margin-top: 16px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <a href="/">← Назад</a>
    <h1>{{.Post.Title}}</h1>
    <div class="meta">{{.Post.PublishedAt}} · {{.AuthorNickname}}</div>
  </header>
  <main>
    <div class="content">{{.Post.ContentHTML}}</div>
    <div class="tags">{{.Post.Tags}}</div>
  </main>
</body>
</html>
{{end}}
